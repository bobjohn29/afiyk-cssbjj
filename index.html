<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Touch Grass</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
padding:20px;
}

.logo{
font-size:70px;
animation:pulse 2s infinite;
}

h1{
font-size:52px;
margin:10px 0;
}

p{
color:#8a8a8a;
font-size:18px;
}

button{
margin-top:25px;
padding:16px 28px;
border:none;
border-radius:20px;
background:#b6ff4d;
color:#050505;
font-weight:bold;
font-size:18px;
box-shadow:0 0 30px rgba(182,255,77,.3);
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">
<div class="logo">🌱</div>
<h1>Touch Grass</h1>
<p>Stay offline. Go outside. Beat your friends.</p>
<button>Start Grass Mode</button>
</div>

</body>
</html>
